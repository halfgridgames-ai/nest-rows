<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Baloo+2:wght@700;800&display=swap">
<style>
  html, body { margin: 0; }
  .shot { width: 1080px; height: 1920px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; font-family: "Baloo 2", sans-serif; }
  .shot::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.18), transparent 45%); }
  .head { position: relative; height: 430px; display: flex; flex-direction: column; justify-content: center; }
  h1 { position: relative; margin: 0 50px; font: 84px/1.08 "Rammetto One", sans-serif; color: #f6eedb; text-align: center; text-shadow: 5px 5px 0 #151838, 11px 11px 0 var(--shadow); letter-spacing: -1px; }
  p { position: relative; margin: 24px 60px 0; font-size: 46px; line-height: 1.2; font-weight: 800; color: #f6eedb; text-align: center; text-shadow: 3px 3px 0 rgba(21,24,56,0.55); }
  .phone { position: relative; margin-top: 20px; width: 820px; height: 1458px; border-radius: 70px 70px 0 0; border: 22px solid #151838; border-bottom: 0; overflow: hidden; box-shadow: 18px 18px 0 rgba(21,24,56,0.35); background: #151838; }
  .phone img { display: block; width: 100%; }
</style></head>
<body><div class="shot" id="s"><div class="head"><h1 id="t"></h1><p id="sub"></p></div><div class="phone"><img id="img"></div></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('t').textContent = q.get('t'); document.getElementById('sub').textContent = q.get('s');
  document.getElementById('img').src = q.get('img');
  const s = document.getElementById('s'); s.style.background = q.get('bg'); s.style.setProperty('--shadow', q.get('sh'));
</script></body></html>
